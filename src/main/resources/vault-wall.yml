# The bank's vault wall: right-clicking one of these blocks opens that player's global vault (/vault <n>),
# offers to sell it, or says what is missing. Replaces MagicSpells spells-city-vaults.yml.
#
# Turn on only after spells-city-vaults.yml and statTrading-vaultDiscount are gone from MagicSpells, or both answer
# the same click. Needs SneakyVariables; reload with /vaultwall reload.
enabled: false

# Price discount in percent (a whole number from 0 to 100) read from this player variable. '' for none.
# Price paid = ceil(amount * (100 - discount) / 100), as the old Trading "Vault Discount" spell computed it.
discount_variable: skillTradingTier4A

# Chests, by id (used by /vaultwall grant|reset):
#   location: world,x,y,z of the block to click
#   vault: the global vault number it opens. Opening still needs sneakyvaults.max.<n> and sneakyvaults.slots.<size>.
#   price: { currency: <bank variable>, amount: <number>, label: <name in the menu> }
#     with owned_variable: the player variable (0/1) that remembers the purchase. SneakyVaults defines it.
#   requires: { variable: <player variable>, min: <number>, message: <toast text> }  checked before anything else.
#   existing_only: true  opens only a vault the player already has saved data for; nobody gets a new one.
#   No price, requires or existing_only: free for everyone.
chests:
  # Penny
  penny-1:
    location: world,5031,60,5016
    vault: 1
    owned_variable: vaultPenny1
    price: { currency: bankPenny, amount: 100, label: Pennies }
  penny-2:
    location: world,5031,60,5018
    vault: 2
    owned_variable: vaultPenny2
    price: { currency: bankPenny, amount: 1000, label: Pennies }
