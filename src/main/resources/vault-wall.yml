  # skill-7:
  #   location: world,x,y,z
  #   vault: 37
  #   existing_only: true
  bag:
    location: world,5025,61,5014
    vault: 54

messages:
  too_poor: "&7You are too poor to upgrade this &6Vault&7!"
  # Default for requires.message
  requirement: "&7Upgrade the &6Existing &7Skill called &6Vault Master"
  # existing_only chest without saved data
  not_available: "&7This &6Vault &7isn't available yet."
  # Vault number above the player's sneakyvaults.max.<n>, or no sneakyvaults.slots.<size>
  missing: "&cCould not find your player vault!"
  # Bank variables not loaded on this server yet
  not_loaded: "&cYour bank is still loading. Try again in a moment."

# Toasts (too poor, requirement). item_model: a namespaced item model id, or '' for the material's own look.
toast_icon:
  material: JIGSAW
  item_model: ''

sounds:
  open: { sound: block.chest.open, volume: 0.4, pitch: 1.0 }
  buy: { sound: lom:buy, volume: 0.4, pitch: 1.0 }
  fail: { sound: lom:fail_wrong, volume: 0.4, pitch: 1.0 }

# The "Buy Vault?" menu: one row (slots 0-8). Lore and names may use {price} and {currency}.
# item_model: a namespaced item model id ('' for the material's own look). An item with no name and no lore
# has its tooltip hidden. background is left out while its slot is -1.
menu:
  title: "&6Buy Vault?"
  background:
    slot: -1
    material: PAPER
    item_model: ''
  confirm:
    slot: 3
    material: LIME_STAINED_GLASS_PANE
    item_model: ''
    name: "&aUnlock Vault?"
    lore:
      - "&eRequires &6{price} {currency}&e!"
      - "&eMoney must be in bank!"
  cancel:
    slot: 5
    material: RED_STAINED_GLASS_PANE
    item_model: ''
    name: "&cNo"
